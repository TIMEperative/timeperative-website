# Builds and tests timeperative.com on every push and pull request.
#
# Deployment: Cloudflare Workers Builds deploys the production branch on
# every push (Cloudflare dashboard, Workers & Pages, timeperative-website,
# Settings, Build). `npm ci` builds the site through the prepare script, so
# Cloudflare's default deploy command `npx wrangler deploy` finds dist/.
#
# News set to Publish in Notion needs a new build to appear. This workflow
# rebuilds and deploys every three hours and on demand, once these
# repository secrets exist (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an account API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's ID
#   NOTION_TOKEN           a Notion integration shared with "TIMEperative website content"
name: Site
on:
  push:
  pull_request:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install and build (prepare runs the news pull and the build)
        run: npm ci
      - run: npm test
      - name: Deploy the news to Cloudflare
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Not deployed
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning title=Cloudflare::CLOUDFLARE_API_TOKEN is not set, so the scheduled rebuild for Notion news was not deployed."
